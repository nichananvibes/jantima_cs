<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ยี่เป็ง เชียงใหม่ | Yi Peng Festival</title><style>
*{box-sizing:border-box}body{margin:0;background:#100f30;color:#fff4da;font-family:system-ui,sans-serif}header{text-align:center;padding:24px 12px 8px;position:relative;z-index:2}h1{font-size:clamp(30px,5vw,56px);margin:8px;color:#ffe2a1}p{line-height:1.6}small{letter-spacing:4px;color:#e5b975}.scene{height:460px;position:relative;overflow:hidden;background:linear-gradient(#100e2c,#392550 65%,#191c3b 66%,#12364c);isolation:isolate}.moon{position:absolute;top:25px;right:16%;width:95px;height:95px;border-radius:50%;background:#fff2c3;box-shadow:0 0 70px #ffd88a88}.star{position:absolute;background:#fff4cf;border-radius:50%;width:2px;height:2px;box-shadow:0 0 5px white}.mount{position:absolute;bottom:34%;width:100%;height:40%;background:#17162e;clip-path:polygon(0 60%,12% 15%,25% 55%,40% 0,55% 60%,70% 20%,85% 55%,100% 10%,100% 100%,0 100%)}.temple{position:absolute;bottom:34%;left:50%;transform:translateX(-50%);width:300px;height:190px;filter:drop-shadow(0 0 12px #ffb44b44)}.river{position:absolute;bottom:0;width:100%;height:34%;background:repeating-linear-gradient(176deg,transparent 0 17px,#e7b77b22 18px 20px,transparent 21px 31px),linear-gradient(#25233f,#103d51)}.lantern{position:absolute;width:22px;height:30px;border-radius:7px 7px 4px 4px;background:linear-gradient(#c65c22,#ffd17a,#fff1b4);box-shadow:0 0 22px #ffad49;animation:rise 14s linear infinite}.lantern:after{content:'';position:absolute;bottom:2px;left:8px;width:6px;height:8px;background:#fff;border-radius:50%}@keyframes rise{from{transform:translate(0,100px)}to{transform:translate(45px,-480px)}}.float{position:absolute;bottom:12%;font-size:52px;filter:drop-shadow(0 0 12px orange);animation:drift 10s ease-in-out forwards}@keyframes drift{from{transform:translate(0,35px) scale(1.2)}to{transform:translate(180px,-55px) scale(.55)}}.panel{max-width:650px;margin: -20px auto 30px;position:relative;z-index:3;background:#24213f;border:1px solid #b68b5066;border-radius:24px;padding:25px;box-shadow:0 12px 40px #0005}label{display:block;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #78617c;border-radius:10px;background:#15152c;color:white;font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:bold;background:#f6cd82;color:#30203a}button.secondary{background:#403455;color:#ffe2a1;border:1px solid #8e725d}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}#msg{min-height:28px;color:#ffdb9b;overflow-wrap:anywhere}footer{text-align:center;color:#bfb0cc;padding:0 15px 25px}@media(max-width:680px){.panel{margin:-15px 12px 25px}.scene{height:360px}}@media(prefers-reduced-motion:reduce){.lantern,.float{animation:none}}
</style></head><body><header><small>CHIANG MAI · LANNA</small><h1>ยี่เป็ง เชียงใหม่</h1><p>คืนแห่งแสงโคม ล่องสายน้ำแห่งความหวัง</p></header><div class="scene" id="scene" aria-label="ภาพจำลองงานยี่เป็ง"><div class="moon"></div><div class="mount"></div><svg class="temple" viewBox="0 0 300 190"><g fill="#d9a65d" stroke="#f8d48b" stroke-width="1"><path d="M150 0 L158 45 L175 75 H125 L142 45Z"/><path d="M150 48 Q120 95 55 110 H245 Q180 95 150 48Z"/><path d="M150 85 Q110 130 20 145 H280 Q190 130 150 85Z"/><rect x="53" y="145" width="194" height="45" fill="#75433d"/><path d="M130 190 V155 Q150 130 170 155 V190Z" fill="#ffd88a"/><rect x="80" y="155" width="18" height="24"/><rect x="202" y="155" width="18" height="24"/></g></svg><div class="river"></div></div><main class="panel"><h2>ฝากคำอธิษฐานไว้กับสายน้ำ</h2><label for="kind">เลือกกระทง</label><select id="kind"><option value="🪷">🪷 กระทงดอกบัว</option><option value="🌸">🌸 กระทงดอกไม้</option><option value="🌿">🌿 กระทงใบตอง</option></select><label for="name">ชื่อของคุณ (ไม่บังคับ)</label><input id="name" maxlength="60" placeholder="ชื่อผู้ลอยกระทง"><label for="wish">คำอธิษฐาน</label><textarea id="wish" maxlength="300" rows="3" placeholder="ขอให้ปีนี้เต็มไปด้วยความสุข..."></textarea><div class="buttons"><button id="float">🪷 ลอยกระทง</button><button class="secondary" id="fly">🏮 ปล่อยโคม</button><button class="secondary" id="share">แชร์เว็บไซต์</button></div><p id="msg" role="status" aria-live="polite"></p></main><footer>สืบสานประเพณีล้านนา • ลอยกระทงออนไลน์ รักษ์สิ่งแวดล้อม<br>คำอธิษฐานแสดงเฉพาะบนหน้าจอของคุณ ไม่ส่งไปยังเซิร์ฟเวอร์</footer><script>
const scene=document.getElementById('scene'),msg=document.getElementById('msg');function lantern(x,delay=0){const e=document.createElement('div');e.className='lantern';e.style.left=x+'%';e.style.top='65%';e.style.animationDelay=delay+'s';scene.append(e);return e}for(let i=0;i<65;i++){let e=document.createElement('i');e.className='star';e.style.left=Math.random()*100+'%';e.style.top=Math.random()*55+'%';scene.append(e)}for(let i=0;i<17;i++)lantern(Math.random()*96,-Math.random()*14);function wish(){return [document.getElementById('name').value.trim(),document.getElementById('wish').value.trim()].filter(Boolean).join(' — ')}document.getElementById('float').onclick=()=>{let e=document.createElement('div');e.className='float';e.style.left='15%';e.textContent=document.getElementById('kind').value+'🕯️';scene.append(e);setTimeout(()=>e.remove(),10500);msg.textContent='ลอยกระทงสำเร็จ ✨ ขอให้สมปรารถนา '+wish();scene.scrollIntoView({behavior:'smooth',block:'center'})};document.getElementById('fly').onclick=()=>{let e=lantern(20+Math.random()*60);setTimeout(()=>e.remove(),14000);msg.textContent='ปล่อยโคมแห่งความหวังแล้ว ✨ '+wish();scene.scrollIntoView({behavior:'smooth',block:'center'})};document.getElementById('share').onclick=async()=>{if(location.protocol==='file:'){msg.textContent='กรุณาเผยแพร่ผ่าน GitHub Pages ก่อนแชร์ลิงก์';return}try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);msg.textContent='คัดลอกลิงก์แล้ว'}}catch(e){msg.textContent='แชร์ลิงก์นี้: '+location.href}};
</script></body></html>
